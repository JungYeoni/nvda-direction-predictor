<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:720px;height:405px;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:40px 52px}
  .eyebrow{font-size:9px;letter-spacing:0;text-transform:uppercase;color:#1B2A4A;font-weight:500;margin-bottom:16px;padding-left:0}
  h2{font-size:24px;font-weight:700;color:#111;letter-spacing:0;margin-bottom:26px}
  .list{display:flex;flex-direction:column;gap:0;flex:1}
  .item{display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid #EBEBEB}
  .item:first-child{border-top:1px solid #EBEBEB}
  .num{font-size:10px;color:#BBB;font-weight:500;width:20px;flex-shrink:0}
  .title{font-size:13px;color:#222;font-weight:500}
  .sub{font-size:11.5px;color:#999;margin-left:auto;white-space:nowrap}
</style>
</head>
<body>
  <div class="eyebrow">목차 · Contents</div>
  <h2>발표 구성</h2>
  <div class="list">
    <div class="item"><div class="num">01</div><div class="title">서론</div></div>
    <div class="item"><div class="num">02</div><div class="title">데이터</div></div>
    <div class="item"><div class="num">03</div><div class="title">모형 1 — Logistic Regression</div></div>
    <div class="item"><div class="num">04</div><div class="title">모형 2 — Huber 회귀→분류</div></div>
    <div class="item"><div class="num">05</div><div class="title">결과 비교</div></div>
    <div class="item"><div class="num">06</div><div class="title">강점 · 한계 · 결론</div></div>
  </div>
</body>
</html>
