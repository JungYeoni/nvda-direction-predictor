<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:720px;height:405px;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;display:grid;grid-template-columns:1fr 260px}
  .left{padding:36px 52px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid #EBEBEB}
  .eyebrow{font-size:9px;letter-spacing:0;text-transform:uppercase;color:#1B2A4A;font-weight:500;margin-bottom:16px}
  h2{font-size:24px;font-weight:700;color:#111;letter-spacing:0;margin-bottom:22px}
  .flow{display:flex;flex-direction:column;gap:10px}
  .model-row{border:1px solid #E0E0E0;padding:12px 14px}
  .model-row .label{font-size:9px;letter-spacing:0;text-transform:uppercase;color:#999;font-weight:500;margin-bottom:3px}
  .model-row .name{font-size:12.5px;color:#333;font-weight:500}
  .model-row .num{font-size:18px;font-weight:700;color:#888;margin-top:2px}
  .model-row.best{border-color:#1B2A4A;background:#F0F4FB}
  .model-row.best .num{color:#C62828}
  .delta{text-align:center;font-size:11px;color:#1B2A4A;font-weight:600}
  .right{background:#1B2A4A;padding:40px 30px;display:flex;flex-direction:column;justify-content:center}
  .right .rt{font-size:9px;letter-spacing:0;text-transform:uppercase;color:#7B9BC8;margin-bottom:16px;font-weight:500}
  .right p{font-size:13px;color:#C8D8F0;line-height:1.7}
  .right strong{color:#fff;font-weight:600}
</style>
</head>
<body>
  <div class="left">
    <div class="eyebrow">결론 · Conclusion</div>
    <h2>결과 요약</h2>
    <div class="flow">
      <div class="model-row">
        <div class="label">모형 1 — 기준</div>
        <div class="name">Logistic Regression &nbsp;·&nbsp; NVDA &gt; 0</div>
        <div class="num">53.78%</div>
      </div>
      <div class="delta">↓ &nbsp;예측 대상을 바꾼 뒤 +6.7%p</div>
      <div class="model-row best">
        <div class="label">모형 2 — 최종</div>
        <div class="name">Huber 회귀→분류 &nbsp;·&nbsp; NVDA−QQQ &gt; 0.2%p</div>
        <div class="num">60.44%</div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="rt">핵심 메시지</div>
    <p>가장 큰 차이는<br><strong>모형을 복잡하게 만든 것보다<br>예측 질문을 바꾼 점</strong>이었다.</p>
    <p style="margin-top:14px;font-size:12px;">"NVDA가 오르는가?"에서<br><strong>"NVDA가 QQQ보다<br>더 강하게 움직이는가?"</strong></p>
  </div>
</body>
</html>
