<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:720px;height:405px;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:28px 40px 24px}
  .header{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .fig-tag{background:#C62828;color:#fff;font-size:9px;padding:3px 10px;border-radius:2px;font-weight:500;letter-spacing:0;white-space:nowrap}
  h2{font-size:17px;font-weight:600;color:#111;letter-spacing:0}
  .acc{font-size:13px;margin-left:auto;white-space:nowrap;color:#C62828;font-weight:600}
  .img-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#FAFAFA;border:1px solid #EBEBEB}
  img{max-width:638px;max-height:270px;object-fit:contain}
  .caption{font-size:10.5px;color:#666;line-height:1.5;margin-top:8px;border-top:1px solid #EBEBEB;padding-top:7px}
  .caption strong{color:#C62828;font-weight:600}
</style>
</head>
<body>
  <div class="header">
    <div class="fig-tag">그림 2</div>
    <h2>모형 2 예측 결과 — Huber 회귀→분류</h2>
    <div class="acc">Accuracy 60.44% &nbsp;(+6.7%p ↑)</div>
  </div>
  <div class="img-wrap">
    <img src="./assets/huber_prediction_correctness.png" alt="Huber 예측 정오 시각화">
  </div>
  <p class="caption"><strong>해석:</strong> 초과수익률을 먼저 예측하면서 단순 상승일보다 강한 상승 신호를 더 선별해, 정답 비율이 높아졌다.</p>
</body>
</html>
